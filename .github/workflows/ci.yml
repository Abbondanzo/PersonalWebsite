name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @abbondanzo/frontend typecheck
        env:
          GOOGLE_UA_KEY: ${{ secrets.GOOGLE_UA_KEY }}
          GOOGLE_UA_KEY_DEV: ${{ secrets.GOOGLE_UA_KEY_DEV }}

      - name: Generate static site
        run: pnpm --filter @abbondanzo/frontend generate
        env:
          # Optional; empty values are enough for CI (build warns if missing).
          GOOGLE_UA_KEY: ${{ secrets.GOOGLE_UA_KEY }}
          GOOGLE_UA_KEY_DEV: ${{ secrets.GOOGLE_UA_KEY_DEV }}
          NODE_ENV: production

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build functions
        run: npm run build
